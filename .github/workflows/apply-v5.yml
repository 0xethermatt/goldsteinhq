name: Apply free-reveal UX v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v5.yml'

permissions:
  contents: write

jobs:
  apply-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write reviewed v5 index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = ''''''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Validate markup and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          required=['First draw is free','Reveal my seat — free','Reroll · 100 $GLDSTN','Claim · 0.025 ETH','The Floor','Available seat universe','secureBtn','characterName','seatNumber','id="firm"']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'Missing required UX markers: {missing}')
          ids=re.findall(r'id="([^"]+)"',s)
          dupes=sorted({x for x in ids if ids.count(x)>1})
          if dupes: raise SystemExit(f'Duplicate IDs: {dupes}')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/app.js
      - name: Commit reviewed redesign
        shell: bash
        run: |
          git config user.name 'Goldstein UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Simplify mint around free reveal and reroll game'
          git push origin HEAD:main
