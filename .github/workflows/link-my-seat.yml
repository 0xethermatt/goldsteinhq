name: Link My Seat page

on:
  push:
    paths:
      - 'scripts/link_my_seat.py'
      - '.github/workflows/link-my-seat.yml'

permissions:
  contents: write

jobs:
  link-seat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply handoff patch
        run: python3 scripts/link_my_seat.py
      - name: Validate My Seat route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wel=Path('welcome.html').read_text()
          seat=Path('my-seat.html').read_text()
          assert "window.location.href='/my-seat'" in wel
          assert '<h1>My Seat</h1>' in seat
          assert 'gAIX' in seat and 'gMEMESTONK' in seat and 'gPRESERVE' in seat
          assert 'Build your rank.' in seat
          print('My Seat integration validation passed')
          PY
      - name: Commit handoff
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add welcome.html
          git diff --cached --quiet || git commit -m "Route claimed Seats into My Seat dashboard"
          git push
