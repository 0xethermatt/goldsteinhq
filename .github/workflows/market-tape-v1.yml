name: Apply Goldstein market tape

on:
  push:
    paths:
      - 'scripts/market-tape-v1.js'
      - '.github/workflows/market-tape-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app market tape
        run: node scripts/market-tape-v1.js
      - name: Validate implementation
        run: |
          node --check scripts/market-tape-v1.js
          grep -q 'goldsteinMarketRight' app.html
          grep -q 'goldsteinMarketRight' my-seat.html
          grep -q 'goldsteinMarketRight' funds.html
          grep -q 'goldsteinMarketRight' fund-detail.html
          ! grep -q '<div class="prototype mono">' app.html
          ! grep -q '<div class="prototype mono">' my-seat.html
          ! grep -q '<div class="prototype mono">' funds.html
          ! grep -q '<div class="prototype mono">' fund-detail.html
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'Goldstein UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.html my-seat.html funds.html fund-detail.html
          git commit -m 'Replace prototype bars with Goldstein market tape'
          git push
