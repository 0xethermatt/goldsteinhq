name: Integrate Seat rank artwork

on:
  push:
    paths:
      - '.github/workflows/integrate-seat-ranks.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Integrate Rabbi Schlomo rank progression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------------- MY SEAT ----------------
          p = Path('my-seat.html')
          s = p.read_text()
          if '/assets/rank-sprite.css' not in s:
              s = s.replace('<meta name="description" content="Goldstein HQ Seat dashboard prototype." />', '<meta name="description" content="Goldstein HQ Seat dashboard prototype." />\n<link rel="stylesheet" href="/assets/rank-sprite.css" />', 1)

          rank_css = r'''
/* Seat rank progression — artwork from the supplied Rabbi Schlomo Goldstein reference */
.rankSeatCard{grid-template-columns:390px 1fr;grid-template-rows:auto 1fr}
.rankSeatCard:after{display:none}
.rankRail{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:11px 12px;border-bottom:1px solid var(--line);background:#0b0b07}
.rankThumb{min-width:0;border:1px solid #282419;border-radius:9px;background:#0e0e0a;color:#8d8572;padding:6px;transition:.18s;text-align:left}
.rankThumb:hover{border-color:#4b4022;transform:translateY(-1px)}
.rankThumb.active{border-color:#82691f;background:#171309;color:#efd05a;box-shadow:inset 0 0 0 1px rgba(216,180,63,.11)}
.rankThumb .rankArtwork{display:block;width:100%;aspect-ratio:171/145;border-radius:6px;border:1px solid rgba(255,255,255,.04)}
.rankThumb b{display:block;margin-top:6px;font:850 8px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rankSeatCard .seatVisual{min-height:350px;padding:24px 22px;display:flex;flex-direction:column;gap:11px;align-items:center;justify-content:center}
.rankArtFrame{position:relative;width:min(300px,100%);filter:drop-shadow(0 22px 44px rgba(0,0,0,.32))}
.rankSeatArt{width:100%;aspect-ratio:171/145;border:1px solid #6b5620;border-radius:18px;box-shadow:inset 0 0 0 6px #090906;transition:opacity .22s ease,transform .22s ease,filter .22s ease}
.rankSeatArt.changing{opacity:.38;transform:scale(.985);filter:blur(1px)}
.rankOverlay{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid rgba(229,192,65,.38);border-radius:9px;background:rgba(7,7,5,.82);backdrop-filter:blur(8px)}
.rankOverlay span{color:#988d70;font:800 8px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}.rankOverlay strong{color:#f0cf58;font:850 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.rankCue{color:#766e5d;font-size:9px;letter-spacing:.09em;text-transform:uppercase;text-align:center}
.rankCurrent{display:flex;align-items:center;gap:8px;margin-top:14px;color:#d8c274;font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.rankCurrent i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px rgba(216,180,63,.42)}
.rankMilestones{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:13px}.rankMilestone{padding:9px 8px;border:1px solid #282419;border-radius:8px;background:#0b0b08;color:#6f6859}.rankMilestone.active{border-color:#5a491c;background:#151208;color:#e2c45a}.rankMilestone b{display:block;font-size:9px}.rankMilestone span{display:block;margin-top:3px;font-size:8px;color:inherit;opacity:.8}.replayRank{margin-left:auto;min-height:38px;padding-inline:12px}
@media(max-width:1050px){.rankSeatCard{grid-template-columns:320px 1fr}.rankRail{grid-template-columns:repeat(3,1fr)}.rankThumb .rankArtwork{display:none}.rankThumb b{margin-top:0;text-align:center;padding:4px 0}}
@media(max-width:760px){.rankSeatCard{grid-template-columns:1fr;grid-template-rows:auto auto auto}.rankRail{grid-column:1;display:flex;overflow-x:auto;scrollbar-width:none;padding:9px}.rankRail::-webkit-scrollbar{display:none}.rankThumb{flex:0 0 92px}.rankThumb .rankArtwork{display:block}.rankSeatCard .seatVisual{min-height:300px;border-bottom:1px solid var(--line)}.rankArtFrame{width:min(280px,88vw)}.rankMilestones{grid-template-columns:repeat(3,1fr)}}
@media(max-width:500px){.rankRail{margin:0}.rankThumb{flex-basis:82px}.rankSeatCard .seatVisual{padding:19px 14px}.rankMilestones{grid-template-columns:repeat(2,1fr)}}
'''
          if '/* Seat rank progression — artwork' not in s:
              s = s.replace('</style>', rank_css + '\n</style>', 1)

          seat_block = r'''  <section class="seatCard rankSeatCard" aria-label="Active Goldstein Seat">
    <div class="rankRail" id="rankRail" aria-label="Seat rank preview">
      <button class="rankThumb" data-rank="0"><span class="rankArtwork rank-intern"></span><b>Intern</b></button>
      <button class="rankThumb" data-rank="1"><span class="rankArtwork rank-analyst"></span><b>Analyst</b></button>
      <button class="rankThumb" data-rank="2"><span class="rankArtwork rank-associate"></span><b>Associate</b></button>
      <button class="rankThumb" data-rank="3"><span class="rankArtwork rank-vp"></span><b>VP</b></button>
      <button class="rankThumb" data-rank="4"><span class="rankArtwork rank-md"></span><b>MD</b></button>
      <button class="rankThumb" data-rank="5"><span class="rankArtwork rank-partner"></span><b>Partner</b></button>
    </div>
    <div class="seatVisual">
      <div class="rankArtFrame"><div class="rankArtwork rank-associate rankSeatArt" id="rankArt" role="img" aria-label="Rabbi Schlomo Goldstein rank artwork"></div><div class="rankOverlay"><span class="mono">Rank preview</span><strong id="visualRank">Associate</strong></div></div>
      <div class="rankCue mono" id="rankCue">Rank follows staked $GLDSTN</div>
    </div>
    <div class="seatInfo">
      <div class="seatStatus mono"><i></i> Active seat</div>
      <h2>Rabbi Schlomo Goldstein</h2>
      <div class="seatNo mono">SEAT #0018</div>
      <div class="rankCurrent mono"><i></i><span id="seatRankName">Associate</span></div>
      <div class="traits">Seeking Opportunities</div>
      <p class="seatCopy">Stake $GLDSTN to rank this Seat from Intern to Partner.</p>
      <div class="seatActions"><button class="btn btnSecondary" id="changeSeat">Change Seat</button><button class="btn btnGhost replayRank" id="replayRank">Preview ranks</button></div>
    </div>
  </section>'''
          s, n = re.subn(r'  <section class="seatCard" aria-label="Active Goldstein Seat">.*?</section>', seat_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('My Seat seatCard block not found')

          stats_block = r'''  <section class="stats" aria-label="Seat summary">
    <div class="stat"><div class="statLabel mono">Rank</div><div class="statValue" id="rankValue">Associate</div><div class="statSub" id="rankNextTop">2,500 $GLDSTN to VP</div></div>
    <div class="stat"><div class="statLabel mono">Staked</div><div class="statValue"><span id="stakedTop">12,500</span></div><div class="statSub">$GLDSTN assigned to Seat #18</div></div>
    <div class="stat"><div class="statLabel mono">Mint capacity</div><div class="statValue" id="capacityValue">3 slots</div><div class="statSub">Prototype capacity · scales with rank</div></div>
  </section>'''
          s, n = re.subn(r'  <section class="stats" aria-label="Seat summary">.*?</section>', stats_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('My Seat stats block not found')

          stake_block = r'''  <section id="stake">
    <div class="sectionHead"><div><div class="eyebrow mono">Your position</div><h2>Stake to rank up.</h2></div><div class="sim mono">Prototype thresholds</div></div>
    <div class="positionGrid">
      <article class="stakeCard">
        <div class="stakeTop"><div><b>$GLDSTN staked</b></div><div class="stakeAmount"><span id="stakedAmount">12,500</span><small>$GLDSTN</small></div></div>
        <div class="progressWrap"><div class="progressLabels"><span id="rankLeft">Associate</span><span id="rankProgress">12,500 / 15,000</span><span id="rankRight">VP</span></div><div class="progress"><i id="progressBar"></i></div></div>
        <div class="rankMilestones" id="rankMilestones"></div>
        <div class="stakeForm"><input id="stakeInput" inputmode="decimal" placeholder="Amount in $GLDSTN" aria-label="Stake amount"><button class="btn btnGold" id="stakeBtn">Stake</button><button class="btn btnSecondary" id="unstakeBtn">Unstake</button></div>
      </article>
      <aside class="economicsCard" aria-label="Seat economics">
        <div class="economic"><small class="mono">Fee share</small><strong id="feeTier">Associate tier</strong><span>Scales with rank.</span></div>
        <div class="economic"><small class="mono">Gold salary</small><strong id="salaryTier">Associate tier</strong><span>Paid at the active rank.</span></div>
        <div class="economic"><small class="mono">Primary minting</small><strong>Enabled</strong><span>Mint G-Funds at NAV.</span></div>
      </aside>
    </div>
  </section>'''
          s, n = re.subn(r'  <section id="stake">.*?</section>', stake_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('My Seat stake block not found')

          # Keep My Seat consistent with the G-Funds launch plan.
          s = s.replace('<span class="fundTicker mono">gPRESERVE</span><span class="available mono">Available</span>', '<span class="fundTicker mono">gPRESERVE</span><span class="available mono" style="color:#8b826e">Coming soon</span>')
          s = s.replace('<div class="fundBottom"><span class="navPrice mono">Mint at NAV</span><button data-fund="gPRESERVE">Mint →</button></div></article>', '<div class="fundBottom"><span class="navPrice mono">Not live</span><button data-fund="gPRESERVE" disabled>Coming soon</button></div></article>')

          # Replace the My Seat controller while retaining nav and toast behavior.
          new_script = r'''<script>
(()=>{
const $=id=>document.getElementById(id);
const ranks=[
  {key:'intern',label:'Intern',min:0,next:1000,capacity:1},
  {key:'analyst',label:'Analyst',min:1000,next:5000,capacity:2},
  {key:'associate',label:'Associate',min:5000,next:15000,capacity:3},
  {key:'vp',label:'VP',min:15000,next:40000,capacity:5},
  {key:'md',label:'MD',min:40000,next:100000,capacity:8},
  {key:'partner',label:'Partner',min:100000,next:null,capacity:12}
];
let staked=Number(localStorage.getItem('goldsteinSeatStake')||12500);if(!Number.isFinite(staked)||staked<0)staked=12500;
let previewTimer=null,previewReturn=null,actualRank=0;
const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),1800)};
const fmt=n=>Math.round(n).toLocaleString();
const rankForStake=v=>{for(let i=ranks.length-1;i>=0;i--)if(v>=ranks[i].min)return i;return 0};
function setVisualRank(i,preview=false){
  const r=ranks[i],art=$('rankArt');
  art.classList.add('changing');
  setTimeout(()=>{art.className=`rankArtwork rank-${r.key} rankSeatArt`;},90);
  setTimeout(()=>art.classList.remove('changing'),220);
  $('visualRank').textContent=r.label;
  $('rankCue').textContent=preview?`Preview · ${r.label}`:'Rank follows staked $GLDSTN';
  document.querySelectorAll('.rankThumb').forEach((b,x)=>b.classList.toggle('active',x===i));
}
function renderMilestones(){
  $('rankMilestones').innerHTML=ranks.map((r,i)=>`<div class="rankMilestone ${i===actualRank?'active':''}"><b class="mono">${r.label}</b><span class="mono">${fmt(r.min)}+</span></div>`).join('');
}
function renderStake(animate=true){
  const previous=actualRank;actualRank=rankForStake(staked);const r=ranks[actualRank];
  $('stakedAmount').textContent=fmt(staked);$('stakedTop').textContent=fmt(staked);$('rankValue').textContent=r.label;$('seatRankName').textContent=r.label;$('capacityValue').textContent=`${r.capacity} ${r.capacity===1?'slot':'slots'}`;$('feeTier').textContent=`${r.label} tier`;$('salaryTier').textContent=`${r.label} tier`;
  $('rankLeft').textContent=r.label;
  if(r.next){const nextRank=ranks[actualRank+1];$('rankRight').textContent=nextRank.label;$('rankProgress').textContent=`${fmt(staked)} / ${fmt(r.next)}`;$('rankNextTop').textContent=`${fmt(Math.max(0,r.next-staked))} $GLDSTN to ${nextRank.label}`;const pct=((staked-r.min)/(r.next-r.min))*100;$('progressBar').style.width=Math.max(0,Math.min(100,pct))+'%';}
  else{$('rankRight').textContent='Top rank';$('rankProgress').textContent='Partner unlocked';$('rankNextTop').textContent='Highest rank';$('progressBar').style.width='100%';}
  renderMilestones();
  if(!previewTimer&&!previewReturn)setVisualRank(actualRank,false);
  localStorage.setItem('goldsteinSeatStake',String(staked));
  if(animate&&previous!==actualRank)toast(`${r.label} rank unlocked · simulated.`);
}
function stopPreview(){clearInterval(previewTimer);clearTimeout(previewReturn);previewTimer=null;previewReturn=null;setVisualRank(actualRank,false)}
function previewRank(i,hold=1500){clearInterval(previewTimer);clearTimeout(previewReturn);previewTimer=null;setVisualRank(i,true);previewReturn=setTimeout(()=>{previewReturn=null;setVisualRank(actualRank,false)},hold)}
function playRanks(){clearInterval(previewTimer);clearTimeout(previewReturn);previewReturn=null;let i=0;setVisualRank(i,true);previewTimer=setInterval(()=>{i++;if(i>=ranks.length){clearInterval(previewTimer);previewTimer=null;previewReturn=setTimeout(()=>{previewReturn=null;setVisualRank(actualRank,false)},650);return;}setVisualRank(i,true)},720)}
function amount(){const v=Number(String($('stakeInput').value).replace(/,/g,''));return Number.isFinite(v)&&v>0?v:0}
$('stakeBtn').onclick=()=>{stopPreview();const v=amount();if(!v)return toast('Enter a $GLDSTN amount.');staked+=v;$('stakeInput').value='';renderStake();toast(`${fmt(v)} $GLDSTN staked · simulated.`)};
$('unstakeBtn').onclick=()=>{stopPreview();const v=amount();if(!v)return toast('Enter a $GLDSTN amount.');staked=Math.max(0,staked-v);$('stakeInput').value='';renderStake();toast(`${fmt(v)} $GLDSTN unstaked · simulated.`)};
$('replayRank').onclick=playRanks;
document.querySelectorAll('.rankThumb').forEach((b,i)=>b.onclick=()=>previewRank(i));
$('changeSeat').onclick=()=>toast('One active Seat in this prototype.');$('walletBtn').onclick=()=>toast('Wallet connected · simulated.');
document.querySelectorAll('.fund button:not(:disabled)').forEach(b=>b.onclick=()=>{const path=b.dataset.fund==='gAIX'?'/funds/gaix':'/funds/gmemestonk';location.href=path});
$('mobileMenu').onclick=()=>$('mobileNav').classList.toggle('show');document.querySelectorAll('#mobileNav a').forEach(a=>a.onclick=()=>$('mobileNav').classList.remove('show'));
renderStake(false);setTimeout(playRanks,520);
})();
</script>'''
          s, n = re.subn(r'<script>\s*\(\(\)=>\{.*?</script>', new_script, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('My Seat script not found')
          p.write_text(s)

          # ---------------- MINT ----------------
          p = Path('index.html')
          s = p.read_text()
          if '/assets/rank-sprite.css' not in s:
              s = s.replace('<link rel="icon" href="/assets/goldstein-keystone.png" />', '<link rel="icon" href="/assets/goldstein-keystone.png" />\n<link rel="stylesheet" href="/assets/rank-sprite.css" />', 1)

          mint_css = r'''
/* Rank evolution preview on the free Seat reveal */
.mintSampleVisual{display:flex;flex-direction:column;gap:12px;padding:22px 14px}.mintArtWrap{position:relative;width:min(255px,92%)}.mintSeatArt{width:100%;height:auto;aspect-ratio:171/145;border-radius:18px;border:1px solid #6b5620;box-shadow:0 18px 55px rgba(0,0,0,.3),inset 0 0 0 5px #090906;transition:opacity .18s ease,transform .18s ease}.mintSeatArt.changing{opacity:.38;transform:scale(.985)}.mintRankBadge{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid rgba(234,197,64,.35);border-radius:8px;background:rgba(7,7,5,.82);color:#9b9072;font-size:8px;letter-spacing:.11em;text-transform:uppercase}.mintRankBadge strong{color:#f0cf58}.mintRankStrip{width:min(282px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.mintRankChip{height:29px;border:1px solid #2d281a;border-radius:7px;background:#0d0d09;color:#726a59;font-size:8px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.mintRankChip.active{border-color:#65521d;background:#171309;color:#edcb52}.mintRankHint{color:#756d5d;font-size:8px;letter-spacing:.08em;text-transform:uppercase}.fallbackSeatOrb{display:grid;place-items:center;color:#efe2bb;font-family:Georgia,serif;font-size:27px;text-align:center;padding:22px;background:linear-gradient(145deg,#c08a55,#684528)!important;background-image:none!important}.fallbackSeatOrb+.mintRankBadge,.fallbackMode~.mintRankStrip,.fallbackMode~.mintRankHint{display:none}
@media(max-width:760px){.mintSampleVisual{min-height:320px}.mintArtWrap{width:min(285px,88vw)}}
'''
          if '/* Rank evolution preview on the free Seat reveal */' not in s:
              s = s.replace('</style>', mint_css + '\n</style>', 1)

          old_visual = '<div class="seatVisual"><div class="seatOrb" id="nameTag">THE VALUE BROKER</div></div>'
          new_visual = '''<div class="seatVisual mintSampleVisual"><div class="mintArtWrap" id="mintArtWrap"><div class="seatOrb rankArtwork rank-intern mintSeatArt" id="nameTag" role="img" aria-label="Rabbi Schlomo Goldstein rank artwork"></div><div class="mintRankBadge mono"><span>Rank preview</span><strong id="mintRankName">Intern</strong></div></div><div class="mintRankStrip" id="mintRankStrip"><button class="mintRankChip active" data-mint-rank="0">Intern</button><button class="mintRankChip" data-mint-rank="1">Analyst</button><button class="mintRankChip" data-mint-rank="2">Associate</button><button class="mintRankChip" data-mint-rank="3">VP</button><button class="mintRankChip" data-mint-rank="4">MD</button><button class="mintRankChip" data-mint-rank="5">Partner</button></div><div class="mintRankHint mono" id="mintRankHint">Stake after claim to rank up</div></div>'''
          if old_visual not in s:
              raise SystemExit('Mint reveal visual not found')
          s = s.replace(old_visual, new_visual, 1)
          s = s.replace('<div class="seatBadge mono" id="seatNumber">SEAT #0354</div>', '<div class="seatBadge mono" id="seatNumber">SEAT #0018</div>', 1)
          s = s.replace('<h3 id="characterName">The Value Broker</h3>', '<h3 id="characterName">Rabbi Schlomo Goldstein</h3>', 1)
          s = s.replace('<div class="traits" id="traits">Patient · Calculated · Relentless</div>', '<div class="traits" id="traits">Seeking Opportunities</div>', 1)

          # Patch draw data and controller without disrupting claim IDs consumed by welcome.html.
          s = s.replace('["The Value Broker","Patient · Calculated · Relentless","Capital Allocation"],', '["Rabbi Schlomo Goldstein","Seeking Opportunities","Capital Allocation",true],', 1)
          s = s.replace('["The Macro Bull","Conviction · Timing · Scale","Global Macro"],', '["The Macro Bull","Conviction · Timing · Scale","Global Macro",false],', 1)
          s = s.replace('["The Quiet Arbitrageur","Precise · Opportunistic · Cold","Market Neutral"],', '["The Quiet Arbitrageur","Precise · Opportunistic · Cold","Market Neutral",false],', 1)
          s = s.replace('["The Deal Maker","Social · Aggressive · Connected","Special Situations"],', '["The Deal Maker","Social · Aggressive · Connected","Special Situations",false],', 1)
          s = s.replace('["The Risk Officer","Skeptical · Disciplined · Unshaken","Risk & Controls"]', '["The Risk Officer","Skeptical · Disciplined · Unshaken","Risk & Controls",false]', 1)

          old_update = "function updateDraw(){const p=draws[currentIndex%draws.length];$('characterName').textContent=p[0];$('nameTag').textContent=p[0].toUpperCase();$('traits').textContent=p[1];$('desk').textContent=p[2];$('rerollBtn').textContent=`Reroll · ${100*Math.pow(2,rerolls)} $GLDSTN`;$('nextReroll').textContent=`Next reroll after this: ${100*Math.pow(2,rerolls+1)} $GLDSTN`;}"
          new_update = r'''const mintRanks=[['intern','Intern'],['analyst','Analyst'],['associate','Associate'],['vp','VP'],['md','MD'],['partner','Partner']];let mintPreviewTimer=null,mintReturn=null;
function setMintRank(i){const [key,label]=mintRanks[i],art=$('nameTag');art.classList.add('changing');setTimeout(()=>{art.className=`seatOrb rankArtwork rank-${key} mintSeatArt`;},70);setTimeout(()=>art.classList.remove('changing'),170);$('mintRankName').textContent=label;document.querySelectorAll('.mintRankChip').forEach((b,x)=>b.classList.toggle('active',x===i));}
function stopMintPreview(){clearInterval(mintPreviewTimer);clearTimeout(mintReturn);mintPreviewTimer=null;mintReturn=null;}
function playMintRanks(){stopMintPreview();let i=0;setMintRank(0);mintPreviewTimer=setInterval(()=>{i++;if(i>=mintRanks.length){clearInterval(mintPreviewTimer);mintPreviewTimer=null;mintReturn=setTimeout(()=>{setMintRank(0);mintReturn=null},450);return;}setMintRank(i)},560)}
function updateDraw(){const p=draws[currentIndex%draws.length];$('characterName').textContent=p[0];$('traits').textContent=p[1];$('desk').textContent=p[2];const art=$('nameTag');if(p[3]){art.className='seatOrb rankArtwork rank-intern mintSeatArt';art.textContent='';$('mintArtWrap').classList.remove('fallbackMode');$('mintRankStrip').style.display='grid';$('mintRankHint').style.display='block';$('mintRankName').textContent='Intern';document.querySelectorAll('.mintRankChip').forEach((b,x)=>b.classList.toggle('active',x===0));}else{stopMintPreview();art.className='seatOrb fallbackSeatOrb';art.textContent=p[0].toUpperCase();$('mintArtWrap').classList.add('fallbackMode');$('mintRankStrip').style.display='none';$('mintRankHint').style.display='none';}$('rerollBtn').textContent=`Reroll · ${100*Math.pow(2,rerolls)} $GLDSTN`;$('nextReroll').textContent=`Next reroll after this: ${100*Math.pow(2,rerolls+1)} $GLDSTN`;}
'''
          if old_update not in s:
              raise SystemExit('Mint updateDraw anchor not found')
          s = s.replace(old_update, new_update, 1)
          s = s.replace("$('drawBtn').textContent='First draw revealed';$('drawBtn').disabled=true;", "$('drawBtn').textContent='First draw revealed';$('drawBtn').disabled=true;setTimeout(playMintRanks,380);", 1)
          s = s.replace("$('rerollBtn').onclick=()=>{rerolls++;currentIndex=(currentIndex+1)%draws.length;updateDraw();const seat=354+rerolls;$('seatNumber').textContent=`SEAT #${String(seat).padStart(4,'0')}`;", "$('rerollBtn').onclick=()=>{stopMintPreview();rerolls++;currentIndex=(currentIndex+1)%draws.length;updateDraw();const seat=354+rerolls;$('seatNumber').textContent=`SEAT #${String(seat).padStart(4,'0')}`;", 1)
          s = s.replace("window.claimSeat=()=>{assigned++;remaining--;", "window.claimSeat=()=>{assigned++;remaining--;try{localStorage.setItem('goldsteinSeatIdentity',JSON.stringify({seat:$('seatNumber').textContent,name:$('characterName').textContent}));}catch(e){}", 1)
