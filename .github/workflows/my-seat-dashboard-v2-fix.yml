name: Apply simplified My Seat dashboard

on:
  push:
    paths:
      - '.github/workflows/my-seat-dashboard-v2-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('my-seat.html')
          s = p.read_text()

          old_header = '''  <header class="pageTop" id="overview">
    <div><div class="eyebrow mono">Seat dashboard</div><h1>My Seat</h1><p>Your identity, rank and access inside Goldstein.</p></div>
    <button class="wallet mono" id="walletBtn"><i></i>0x71…9A3</button>
  </header>'''
          new_header = '''  <header class="pageTop" id="overview">
    <div><div class="eyebrow mono">Seat dashboard</div><h1>My Seat</h1><p>Your identity, rank and access inside Goldstein.</p></div>
    <div class="pageActions">
      <button class="rankToggle" id="rankToggle" type="button" role="switch" aria-checked="false" aria-controls="rankPreviewPanel"><span class="toggleTrack"><i></i></span><span>Preview ranks</span></button>
      <button class="wallet mono" id="walletBtn"><i></i>0x71…9A3</button>
    </div>
  </header>'''
          if old_header not in s:
              raise SystemExit('Header anchor not found')
          s = s.replace(old_header, new_header, 1)

          start = s.index('  <section class="seatCard rankSeatCard"')
          end = s.index('  <section class="stats"', start)
          new_card = '''  <section class="seatCard seatSummaryCard" aria-label="Active Goldstein Seat">
    <div class="rankPreviewPanel" id="rankPreviewPanel" hidden>
      <div class="rankPreviewHead"><div><span class="mono">Rank preview</span><b>See how this Seat evolves with stake.</b></div><span class="mono">Select a rank</span></div>
      <div class="rankRail" id="rankRail" aria-label="Seat rank preview">
        <button class="rankThumb" data-rank="-1"><span class="rankArtwork rank-base"></span><b>Seat</b></button>
        <button class="rankThumb" data-rank="0"><span class="rankArtwork rank-intern"></span><b>Intern</b></button>
        <button class="rankThumb" data-rank="1"><span class="rankArtwork rank-analyst"></span><b>Analyst</b></button>
        <button class="rankThumb" data-rank="2"><span class="rankArtwork rank-associate"></span><b>Associate</b></button>
        <button class="rankThumb" data-rank="3"><span class="rankArtwork rank-vp"></span><b>VP</b></button>
        <button class="rankThumb" data-rank="4"><span class="rankArtwork rank-md"></span><b>MD</b></button>
        <button class="rankThumb" data-rank="5"><span class="rankArtwork rank-partner"></span><b>Partner</b></button>
      </div>
    </div>

    <div class="seatCore">
      <div class="seatVisual">
        <div class="rankArtFrame">
          <div class="rankArtwork rank-intern rankSeatArt" id="rankArt" role="img" aria-label="Rabbi Schlomo Goldstein active Seat artwork"></div>
          <div class="previewBadge mono" id="previewBadge" hidden>Preview · <strong id="visualRank">Intern</strong></div>
        </div>
      </div>

      <div class="seatInfo">
        <div class="seatTopLine">
          <div><div class="seatNo mono">Seat #0018</div><h2>Rabbi Schlomo Goldstein</h2></div>
          <button class="btn btnSecondary changeSeatTop" id="changeSeat">Change active seat</button>
        </div>
        <div class="seatDivider"></div>
        <div class="seatMetricGrid">
          <div class="seatMetric">
            <small class="mono">Gold salary</small>
            <div class="metricValueRow"><strong>0.00 <em>GLD</em></strong><button class="collectBtn" disabled>Collect</button></div>
            <span id="salaryTier">Intern · 1× salary</span>
          </div>
          <div class="seatMetric">
            <small class="mono">Fee share</small>
            <strong id="feeShareValue">0.10%</strong>
            <span>Rank-based protocol fee share.</span>
          </div>
          <div class="seatMetric">
            <small class="mono">Power rank</small>
            <strong id="powerRankValue">#8 of 8</strong>
            <span>By stake across active Seats.</span>
          </div>
          <div class="seatMetric">
            <small class="mono">Rank</small>
            <strong class="rankMetric" id="rankValue">Intern</strong>
            <span id="rankNextTop">1,000 $GLDSTN to Analyst</span>
          </div>
          <div class="seatMetric">
            <small class="mono">Staked</small>
            <strong><span id="stakedTop">0</span> <em>$GLDSTN</em></strong>
            <span>Attributed to Seat #18.</span>
          </div>
          <div class="seatMetric">
            <small class="mono">Mint capacity</small>
            <strong id="capacityValue">$10,000</strong>
            <span>Primary minting at NAV.</span>
          </div>
        </div>
      </div>
    </div>
  </section>

'''
          s = s[:start] + new_card + s[end:]

          stats_start = s.index('  <section class="stats"')
          stake_start = s.index('  <section id="stake">', stats_start)
          s = s[:stats_start] + s[stake_start:]

          econ_start = s.find('      <aside class="economicsCard" aria-label="Seat economics">')
          if econ_start != -1:
              econ_end = s.find('      </aside>', econ_start)
              if econ_end == -1:
                  raise SystemExit('Economics card end not found')
              econ_end += len('      </aside>')
              s = s[:econ_start] + s[econ_end:]

          css = '''
/* My Seat simplified dashboard v2 */
.pageActions{display:flex;align-items:center;gap:10px}
.rankToggle{height:44px;display:inline-flex;align-items:center;gap:9px;padding:0 13px;border:1px solid #51431f;border-radius:999px;background:#151208;color:#e6d6a0;font-size:13px;font-weight:850;white-space:nowrap}
.toggleTrack{position:relative;width:32px;height:18px;border:1px solid #4d4228;border-radius:999px;background:#0b0b08;transition:.18s}
.toggleTrack i{position:absolute;top:3px;left:3px;width:10px;height:10px;border-radius:50%;background:#7e7767;transition:.18s}
.rankToggle[aria-checked="true"]{border-color:#81691f;background:#1c1709;color:#f0cf58}
.rankToggle[aria-checked="true"] .toggleTrack{border-color:#967a24;background:#2d250b}
.rankToggle[aria-checked="true"] .toggleTrack i{left:17px;background:#f0cf58;box-shadow:0 0 12px rgba(240,207,88,.38)}
.seatSummaryCard{display:block!important;min-height:0!important;overflow:hidden;border-color:#5b491d;background:radial-gradient(circle at 88% 12%,rgba(216,180,63,.08),transparent 34%),linear-gradient(180deg,#12110b,#0d0d09)}
.seatSummaryCard:after{display:none!important}
.seatCore{display:grid;grid-template-columns:350px minmax(0,1fr)}
.seatSummaryCard .seatVisual{min-height:360px;padding:28px;border-right:1px solid var(--line);background:radial-gradient(circle at 50% 32%,rgba(216,180,63,.10),transparent 50%),#0d0d09}
.seatSummaryCard .seatVisual:before{display:none}
.seatSummaryCard .rankArtFrame{position:relative;width:min(292px,100%);filter:drop-shadow(0 22px 45px rgba(0,0,0,.32))}
.seatSummaryCard .rankSeatArt{width:100%;aspect-ratio:1/1;border:1px solid #6c5720;border-radius:10px;box-shadow:0 0 0 7px #111008,0 0 0 8px #4d4020;transition:none!important}
.previewBadge{position:absolute;left:10px;right:10px;bottom:10px;padding:8px 10px;border:1px solid rgba(231,193,64,.42);border-radius:7px;background:rgba(8,8,5,.88);color:#a39776;text-align:center;font-size:12px;letter-spacing:.09em}
.previewBadge strong{color:#f0cf58}
.seatSummaryCard .seatInfo{padding:30px 34px 28px;display:block}
.seatTopLine{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.seatSummaryCard .seatInfo h2{margin:4px 0 0;font-size:38px;line-height:1.04}
.seatSummaryCard .seatNo{color:#8e8674;font-size:13px;font-weight:700;letter-spacing:0;text-transform:none}
.changeSeatTop{flex:0 0 auto;min-height:40px;border-radius:999px;color:#efce56;border-color:#614f1b;background:#1b1608}
.seatDivider{height:1px;margin:16px 0 18px;background:#30291a}
.seatMetricGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 26px}
.seatMetric small{display:block;color:#827a68;font-size:12px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
.seatMetric>strong,.metricValueRow strong{display:block;margin-top:6px;color:#f0e8d4;font:600 24px/1.05 Georgia,"Times New Roman",serif}
.seatMetric strong em,.metricValueRow strong em{font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9b927e;font-style:normal}
.seatMetric .rankMetric{color:#f0c947}
.seatMetric>span,.metricValueRow+span{display:block;margin-top:6px;color:#817968;font-size:12px;line-height:1.4}
.metricValueRow{display:flex;align-items:center;gap:10px;margin-top:2px}
.metricValueRow strong{margin-top:0}
.collectBtn{height:34px;padding:0 12px;border:0;border-radius:8px;background:#0d351c;color:#44b86f;font-size:12px;font-weight:850}
.collectBtn:disabled{opacity:.55;cursor:not-allowed}
.rankPreviewPanel[hidden]{display:none!important}
.rankPreviewPanel{padding:13px 14px 14px;border-bottom:1px solid var(--line);background:#0b0b07}
.rankPreviewHead{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:0 2px 10px}
.rankPreviewHead div span,.rankPreviewHead>span{color:#756e60;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.rankPreviewHead b{display:block;margin-top:3px;color:#cfc5ad;font-size:13px}
.rankPreviewPanel .rankRail{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:0;border:0;background:transparent}
.rankPreviewPanel .rankThumb{padding:7px;border-radius:9px}
.rankPreviewPanel .rankThumb .rankArtwork{display:block!important;aspect-ratio:1/1;border-radius:6px}
.rankPreviewPanel .rankThumb b{font-size:12px}
.rankPreviewPanel .rankThumb.active{border-color:#8f7220;background:#191408;color:#efcc51}
.positionGrid{grid-template-columns:1fr!important}
.stakeCard{max-width:none}
.economicsCard{display:none!important}
@media(max-width:980px){.seatCore{grid-template-columns:300px minmax(0,1fr)}.seatSummaryCard .seatVisual{min-height:330px;padding:22px}.seatMetricGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.rankPreviewPanel .rankRail{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:760px){.pageTop{display:grid}.pageActions{width:100%;justify-content:space-between}.rankToggle{height:40px}.seatCore{grid-template-columns:1fr}.seatSummaryCard .seatVisual{min-height:0;padding:24px 18px;border-right:0;border-bottom:1px solid var(--line)}.seatSummaryCard .rankArtFrame{width:min(310px,82vw)}.seatSummaryCard .seatInfo{padding:24px 20px}.seatTopLine{display:grid}.changeSeatTop{justify-self:start}.seatMetricGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 16px}.rankPreviewHead>span{display:none}.rankPreviewPanel .rankRail{display:flex;overflow-x:auto;scrollbar-width:none}.rankPreviewPanel .rankRail::-webkit-scrollbar{display:none}.rankPreviewPanel .rankThumb{flex:0 0 112px}.rankPreviewPanel .rankThumb .rankArtwork{display:block!important}}
@media(max-width:480px){.pageActions{align-items:stretch;display:grid;grid-template-columns:1fr auto}.rankToggle{justify-content:center}.seatMetricGrid{grid-template-columns:1fr 1fr}.seatMetric>strong,.metricValueRow strong{font-size:21px}.seatSummaryCard .seatInfo h2{font-size:32px}.rankPreviewPanel .rankThumb{flex-basis:98px}}
'''
          s = s.replace('</style>', css + '\n</style>', 1)

          script_start = s.rindex('<script>')
          script_end = s.index('</script>', script_start) + len('</script>')
          script = '''<script>
(()=>{
const $=id=>document.getElementById(id);
const baseSeat={key:'base',label:'Seat'};
const ranks=[
  {key:'intern',label:'Intern',min:0,next:1000,capacity:'$10,000',fee:'0.10%',salary:'1× salary',power:'#8 of 8'},
  {key:'analyst',label:'Analyst',min:1000,next:5000,capacity:'$25,000',fee:'0.20%',salary:'1.2× salary',power:'#6 of 8'},
  {key:'associate',label:'Associate',min:5000,next:15000,capacity:'$50,000',fee:'0.35%',salary:'1.5× salary',power:'#4 of 8'},
  {key:'vp',label:'VP',min:15000,next:40000,capacity:'$100,000',fee:'0.55%',salary:'2× salary',power:'#3 of 8'},
  {key:'md',label:'MD',min:40000,next:100000,capacity:'$250,000',fee:'0.80%',salary:'3× salary',power:'#2 of 8'},
  {key:'partner',label:'Partner',min:100000,next:null,capacity:'$500,000',fee:'1.10%',salary:'5× salary',power:'#1 of 8'}
];
let staked=Number(localStorage.getItem('goldsteinSeatStakeV2')||0);
if(!Number.isFinite(staked)||staked<0)staked=0;
let actualRank=0,previewOpen=false;
const toast=t=>{$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>$('toast').classList.remove('show'),1800)};
const fmt=n=>Math.round(n).toLocaleString();
const rankForStake=v=>{for(let i=ranks.length-1;i>=0;i--)if(v>=ranks[i].min)return i;return 0};
function setVisualRank(i,isPreview=false){
  const r=i<0?baseSeat:ranks[i],art=$('rankArt');
  art.className=`rankArtwork rank-${r.key} rankSeatArt`;
  $('visualRank').textContent=r.label;
  $('previewBadge').hidden=!isPreview;
  document.querySelectorAll('.rankThumb').forEach(b=>b.classList.toggle('active',Number(b.dataset.rank)===i));
}
function renderMilestones(){
  $('rankMilestones').innerHTML=ranks.map((r,i)=>`<div class="rankMilestone ${i===actualRank?'active':''}"><b class="mono">${r.label}</b><span class="mono">${fmt(r.min)}+</span></div>`).join('');
}
function renderStake(announce=true){
  const previous=actualRank;actualRank=rankForStake(staked);const r=ranks[actualRank];
  $('stakedAmount').textContent=fmt(staked);$('stakedTop').textContent=fmt(staked);$('rankValue').textContent=r.label;$('capacityValue').textContent=r.capacity;$('feeShareValue').textContent=r.fee;$('powerRankValue').textContent=r.power;$('salaryTier').textContent=`${r.label} · ${r.salary}`;$('rankLeft').textContent=r.label;
  if(r.next){const next=ranks[actualRank+1];$('rankRight').textContent=next.label;$('rankProgress').textContent=`${fmt(staked)} / ${fmt(r.next)}`;$('rankNextTop').textContent=`${fmt(Math.max(0,r.next-staked))} $GLDSTN to ${next.label}`;const pct=((staked-r.min)/(r.next-r.min))*100;$('progressBar').style.width=Math.max(0,Math.min(100,pct))+'%';}
  else{$('rankRight').textContent='Top rank';$('rankProgress').textContent='Partner unlocked';$('rankNextTop').textContent='Highest rank';$('progressBar').style.width='100%';}
  renderMilestones();if(!previewOpen)setVisualRank(actualRank,false);localStorage.setItem('goldsteinSeatStakeV2',String(staked));if(announce&&previous!==actualRank)toast(`${r.label} rank unlocked · simulated.`);
}
function setPreview(open){
  previewOpen=open;$('rankPreviewPanel').hidden=!open;$('rankToggle').setAttribute('aria-checked',String(open));
  if(open){setVisualRank(actualRank,true);}else{setVisualRank(actualRank,false);}
}
function amount(){const v=Number(String($('stakeInput').value).replace(/,/g,''));return Number.isFinite(v)&&v>0?v:0}
$('rankToggle').onclick=()=>setPreview(!previewOpen);
document.querySelectorAll('.rankThumb').forEach(b=>b.onclick=()=>{if(previewOpen)setVisualRank(Number(b.dataset.rank),true)});
$('stakeBtn').onclick=()=>{setPreview(false);const v=amount();if(!v)return toast('Enter a $GLDSTN amount.');staked+=v;$('stakeInput').value='';renderStake();toast(`${fmt(v)} $GLDSTN staked · simulated.`)};
$('unstakeBtn').onclick=()=>{setPreview(false);const v=amount();if(!v)return toast('Enter a $GLDSTN amount.');staked=Math.max(0,staked-v);$('stakeInput').value='';renderStake();toast(`${fmt(v)} $GLDSTN unstaked · simulated.`)};
$('changeSeat').onclick=()=>toast('Seat selector opens here in the full app.');
$('walletBtn').onclick=()=>toast('Wallet connected · simulated.');
document.querySelectorAll('.fund button:not(:disabled)').forEach(b=>b.onclick=()=>{location.href=b.dataset.fund==='gAIX'?'/app/funds/gaix':'/app/funds/gmemestonk'});
$('mobileMenu').onclick=()=>$('mobileNav').classList.toggle('show');
document.querySelectorAll('#mobileNav a').forEach(a=>a.onclick=()=>$('mobileNav').classList.remove('show'));
renderStake(false);setPreview(false);
})();
</script>'''
          s = s[:script_start] + script + s[script_end:]
          p.write_text(s)
          PY

      - name: Validate
        run: |
          grep -q 'id="rankToggle"' my-seat.html
          grep -q 'id="rankPreviewPanel" hidden' my-seat.html
          grep -q 'class="seatMetricGrid"' my-seat.html
          grep -q 'Gold salary' my-seat.html
          grep -q 'Fee share' my-seat.html
          grep -q 'Power rank' my-seat.html
          grep -q 'Mint capacity' my-seat.html
          ! grep -q 'setTimeout(playRanks' my-seat.html
          ! grep -q 'id="replayRank"' my-seat.html
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s=fs.readFileSync('my-seat.html','utf8');
          for(const m of s.matchAll(/<script>([\s\S]*?)<\/script>/g)) new vm.Script(m[1]);
          console.log('JS syntax OK');
          NODE

      - name: Commit
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add my-seat.html
          git commit -m "Simplify My Seat dashboard and rank preview" || exit 0
          git push
