name: Apply Adam LP feedback

on:
  push:
    paths:
      - '.github/workflows/adam-lp-feedback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply LP feedback
        run: python3 scripts/apply_adam_lp_feedback.py
      - name: Validate
        run: |
          grep -q 'Your LP' funds.html
          grep -q 'Fees' funds.html
          grep -q 'Manage LP' fund-detail.html
          if grep -q 'Launch funds' funds.html; then exit 1; fi
      - name: Commit
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.html fund-detail.html
          git commit -m "Refine LP management and fund labels" || exit 0
          git push
