name: Apply FAQ redesign

on:
  push:
    paths:
      - 'scripts/apply_faq_redesign.py'
      - '.github/workflows/faq-redesign.yml'

permissions:
  contents: write

jobs:
  apply-faq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply FAQ patch
        run: python3 scripts/apply_faq_redesign.py
      - name: Validate FAQ redesign
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert s.count('<section class="faqSection"') == 1
          assert s.count('id="faqList"') == 1
          assert 'class="explainers"' not in s
          assert '<span>FAQ</span>' in s
          assert 'How does the mint game work?' not in s
          assert 'What is The Floor?' in s
          print('FAQ redesign validation passed')
          PY
      - name: Commit FAQ redesign
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Redesign and expand FAQ section"
          git push