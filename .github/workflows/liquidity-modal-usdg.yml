name: Goldstein liquidity modal and USDG settlement

on:
  push:
    paths:
      - '.github/workflows/liquidity-modal-usdg.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch fund UX
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shared_css = r'''
/* Goldstein LP / primary-market ticket v5 */
.liquidityTicket{width:min(620px,100%);max-height:min(860px,calc(100vh - 36px));overflow:auto;border-color:#5a491f;background:radial-gradient(circle at 82% 0%,rgba(216,180,63,.08),transparent 30%),linear-gradient(180deg,#15130c,#0b0b08);box-shadow:0 36px 130px rgba(0,0,0,.58)}
.liquidityTicket .ticketHead{position:sticky;top:0;z-index:4;background:rgba(18,16,10,.96);backdrop-filter:blur(14px)}
.lpModeTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border:1px solid #302a1c;border-radius:11px;background:#090905;margin-bottom:18px}.lpModeTab{height:42px;border:1px solid transparent;border-radius:8px;background:transparent;color:#8f8773;font-size:12px;font-weight:850;letter-spacing:.055em;text-transform:uppercase}.lpModeTab.active{border-color:#6c5720;background:#1b1608;color:#efcc51;box-shadow:inset 0 0 0 1px rgba(216,180,63,.08)}
.lpStats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:18px}.lpStat{padding:11px 12px;border:1px solid #292419;border-radius:9px;background:#0b0b08}.lpStat small{display:block;color:#766e5e;font-size:12px;letter-spacing:.09em;text-transform:uppercase}.lpStat b{display:block;margin-top:5px;color:#ddd3b9;font-size:13px}.lpStat b.green{color:#8fe3aa}
.lpSection{padding:16px;border:1px solid #30291b;border-radius:12px;background:#0c0c08}.lpSection+.lpSection{margin-top:10px}.lpSectionHead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}.lpSectionHead b{font-size:14px}.lpSectionHead span{color:#827968;font-size:12px}.rangePresets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.rangePreset{height:38px;border:1px solid #302a1c;border-radius:8px;background:#0a0a07;color:#837b69;font-size:12px;font-weight:850;text-transform:uppercase}.rangePreset.active{border-color:#d8b43f;background:#171308;color:#edc94a}.rangeGrid,.depositGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.fieldLabel{display:block;color:#827968;font-size:12px}.fieldBox{position:relative;margin-top:5px}.fieldBox input{width:100%;height:48px;padding:0 68px 0 12px;border:1px solid #403721;border-radius:9px;background:#090905;color:#eee4cc;outline:none;font-size:15px}.fieldBox input:focus{border-color:#8b7023}.fieldBox span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#a59054;font-size:12px;font-weight:850}.quoteLine{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:#77705f;font-size:12px}.quoteLine b{color:#b8ad91}
.aprBreakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.aprItem{padding:11px 12px;border:1px solid #292419;border-radius:9px;background:#090905}.aprItem small{display:block;color:#726a5b;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.aprItem strong{display:block;margin-top:5px;color:#d9cfb6;font-size:15px}.aprItem.total strong{color:#8fe3aa}
.lpPrimary{width:100%;height:50px;margin-top:12px;border:1px solid #e8c13d;border-radius:10px;background:linear-gradient(#f0cc4c,#d5aa23);color:#130f02;font-size:13px;font-weight:900}.lpPrimary:disabled{opacity:.45;cursor:not-allowed}.lpFine{margin-top:9px;color:#706858;font-size:12px;text-align:center;line-height:1.5}
.simpleTrade[hidden],.lpWorkspace[hidden],.withdrawPane[hidden],.collectPane[hidden],.addPane[hidden]{display:none!important}.simpleTrade{display:grid;gap:10px}.tradeSummary{padding:14px;border:1px solid #30291b;border-radius:11px;background:#0c0c08}.tradeSummary strong{display:block;font:500 23px/1.1 Georgia,'Times New Roman',serif}.tradeSummary span{display:block;margin-top:6px;color:#887f6b;font-size:12px;line-height:1.55}.tradeQuote{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #272318;color:#847c69;font-size:12px}.tradeQuote b{color:#ded4ba}.withdrawQuick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.withdrawQuick button{height:38px;border:1px solid #342e1e;border-radius:8px;background:#0a0a07;color:#9a917c;font-size:12px;font-weight:850}.claimGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.claimBox{padding:14px;border:1px solid #30291b;border-radius:10px;background:#090905}.claimBox small{display:block;color:#756d5d;font-size:12px;text-transform:uppercase}.claimBox strong{display:block;margin-top:7px;color:#e1d7bd;font-size:17px}.claimBox.emission strong{color:#8fe3aa}
@media(max-width:600px){.liquidityTicket{max-height:calc(100vh - 18px)}.lpStats,.aprBreakdown{grid-template-columns:1fr 1fr}.lpStats .lpStat:last-child,.aprBreakdown .aprItem:last-child{grid-column:1/-1}.rangeGrid,.depositGrid{grid-template-columns:1fr}.rangePresets{grid-template-columns:1fr 1fr}.ticketBody{padding:17px}.liquidityTicket .ticketHead{padding:18px}}
'''

          funds_modal = r'''<div class="modal" id="actionModal" aria-hidden="true"><section class="ticket liquidityTicket" role="dialog" aria-modal="true" aria-labelledby="ticketTitle"><div class="ticketHead"><div><small class="mono" id="ticketType">Add liquidity</small><h3 id="ticketTitle">$gAIX</h3></div><button class="close" id="closeModal" aria-label="Close">×</button></div><div class="ticketBody">
<div class="lpWorkspace" id="lpWorkspace">
  <div class="lpModeTabs" id="lpModeTabs"><button class="lpModeTab active" data-lp-mode="add">Add liquidity</button><button class="lpModeTab" data-lp-mode="withdraw">Withdraw</button><button class="lpModeTab" data-lp-mode="collect">Collect</button></div>
  <div class="lpStats"><div class="lpStat"><small class="mono">Market</small><b class="mono" id="ticketFund">$gAIX / USDG</b></div><div class="lpStat"><small class="mono">TVL</small><b id="ticketTvl">$6.84M</b></div><div class="lpStat"><small class="mono">LP APR</small><b class="green" id="ticketApr">18.6%</b></div></div>
  <div class="addPane" id="addPane">
    <div class="lpSection"><div class="lpSectionHead"><b>Price range</b><span class="mono" id="rangeStatus">Wide · in range</span></div><div class="rangePresets"><button class="rangePreset" data-range="full">Full</button><button class="rangePreset active" data-range="wide">Wide</button><button class="rangePreset" data-range="medium">Medium</button><button class="rangePreset" data-range="tight">Tight</button></div><div class="rangeGrid"><label class="fieldLabel">Lower<div class="fieldBox"><input id="rangeLower" inputmode="decimal"><span class="mono">USDG</span></div></label><label class="fieldLabel">Upper<div class="fieldBox"><input id="rangeUpper" inputmode="decimal"><span class="mono">USDG</span></div></label></div></div>
    <div class="lpSection"><div class="lpSectionHead"><b>Deposit</b><span>Mock quote</span></div><div class="depositGrid"><label class="fieldLabel"><span id="fundDepositLabel">gAIX</span><div class="fieldBox"><input id="fundDeposit" inputmode="decimal" placeholder="0.00"><span class="mono" id="fundDepositUnit">gAIX</span></div></label><label class="fieldLabel">USDG<div class="fieldBox"><input id="usdgDeposit" inputmode="decimal" placeholder="0.00"><span class="mono">USDG</span></div></label></div><div class="quoteLine"><span>Reference NAV</span><b id="navQuote">$109.34</b></div></div>
    <div class="lpSection"><div class="aprBreakdown"><div class="aprItem"><small class="mono">Fees APR</small><strong id="feeApr">6.8%</strong></div><div class="aprItem"><small class="mono">Emissions APR</small><strong id="emissionApr">11.8%</strong></div><div class="aprItem total"><small class="mono">Total LP APR</small><strong id="totalApr">18.6%</strong></div></div></div>
  </div>
  <div class="withdrawPane" id="withdrawPane" hidden><div class="lpSection"><div class="lpSectionHead"><b>Your LP position</b><span class="mono">Mock balance</span></div><div class="tradeSummary"><strong id="withdrawBalance">$18,750</strong><span>Choose how much liquidity to remove from this fund/USDG pool.</span></div><div class="withdrawQuick"><button data-withdraw="25">25%</button><button data-withdraw="50">50%</button><button data-withdraw="75">75%</button><button data-withdraw="100">Max</button></div></div></div>
  <div class="collectPane" id="collectPane" hidden><div class="lpSection"><div class="lpSectionHead"><b>Claimable</b><span class="mono">Mock position</span></div><div class="claimGrid"><div class="claimBox"><small class="mono">Fees</small><strong id="claimFeesValue">$184.26</strong></div><div class="claimBox emission"><small class="mono">Emissions</small><strong id="claimEmissionsValue">3,840 GLDSTN</strong></div></div></div></div>
</div>
<div class="simpleTrade" id="simpleTrade" hidden><div class="lpStats"><div class="lpStat"><small class="mono">Market</small><b class="mono" id="simpleMarket">$gAIX / USDG</b></div><div class="lpStat"><small class="mono">Reference NAV</small><b id="simpleNav">$109.34</b></div><div class="lpStat"><small class="mono">Settlement</small><b>USDG</b></div></div><div class="tradeSummary"><strong id="simpleTitle">Buy $gAIX</strong><span id="simpleCopy">Acquire the fund on the secondary market using USDG.</span></div><div class="amountWrap"><input id="actionAmount" inputmode="decimal" placeholder="0.00" aria-label="USDG amount"><span class="mono">USDG</span></div><div class="tradeQuote"><span>Estimated receive</span><b id="simpleReceive">—</b></div></div>
<button class="lpPrimary" id="previewAction">Preview liquidity</button><div class="lpFine" id="ticketNote">Prototype only · mock routing, price and position data.</div></div></section></div>
'''

          detail_modal = funds_modal.replace('id="actionModal"','id="modal"').replace('id="ticketType"','id="actionLabel"').replace('id="ticketTitle"','id="modalTicker"').replace('id="closeModal"','id="close"').replace('id="actionAmount"','id="amount"').replace('id="previewAction"','id="preview"')

          shared_js_funds = r'''
<script>
/* Goldstein action-ticket controller v5 */
(()=>{
 const $=id=>document.getElementById(id), modal=$('actionModal'); if(!modal)return;
 const mock={gaix:{ticker:'gAIX',nav:109.34,tvl:'$6.84M',apr:'18.6%',feeApr:'6.8%',emissionApr:'11.8%',lp:'$18,750',fees:'$184.26',earned:'3,840 GLDSTN'},meme:{ticker:'gMEMESTONK',nav:43.73,tvl:'$2.31M',apr:'32.4%',feeApr:'12.7%',emissionApr:'19.7%',lp:'$7,420',fees:'$96.84',earned:'2,960 GLDSTN'}};
 let state={action:'Add liquidity',fund:'gAIX',d:mock.gaix,lpMode:'add'};
 const toast=t=>{const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__gTicket);window.__gTicket=setTimeout(()=>el.classList.remove('show'),1700)};
 const key=f=>String(f).toLowerCase().includes('meme')?'meme':'gaix';
 function range(mode){const n=state.d.nav, map={full:[.01,1000000],wide:[n*.5,n*1.5],medium:[n*.75,n*1.25],tight:[n*.9,n*1.1]},v=map[mode]||map.wide;$('rangeLower').value=v[0]<1?v[0].toFixed(2):v[0].toFixed(2);$('rangeUpper').value=v[1]>99999?'1,000,000':v[1].toFixed(2);$('rangeStatus').textContent=(mode[0].toUpperCase()+mode.slice(1))+' · in range';document.querySelectorAll('#actionModal .rangePreset').forEach(b=>b.classList.toggle('active',b.dataset.range===mode));}
 function lpMode(mode){state.lpMode=mode;document.querySelectorAll('#actionModal .lpModeTab').forEach(b=>b.classList.toggle('active',b.dataset.lpMode===mode));$('addPane').hidden=mode!=='add';$('withdrawPane').hidden=mode!=='withdraw';$('collectPane').hidden=mode!=='collect';$('previewAction').textContent=mode==='add'?'Add liquidity':mode==='withdraw'?'Preview withdrawal':'Collect fees + emissions';}
 function config(action,fund){state.action=action;state.fund=fund;state.d=mock[key(fund)];const d=state.d;$('ticketType').textContent=action;$('ticketTitle').textContent='$'+d.ticker;$('ticketFund').textContent='$'+d.ticker+' / USDG';$('ticketTvl').textContent=d.tvl;$('ticketApr').textContent=d.apr;$('fundDepositLabel').textContent=d.ticker;$('fundDepositUnit').textContent=d.ticker;$('navQuote').textContent='$'+d.nav.toFixed(2);$('feeApr').textContent=d.feeApr;$('emissionApr').textContent=d.emissionApr;$('totalApr').textContent=d.apr;$('withdrawBalance').textContent=d.lp;$('claimFeesValue').textContent=d.fees;$('claimEmissionsValue').textContent=d.earned;
   const isLp=action==='Add liquidity'||action==='Manage LP';$('lpWorkspace').hidden=!isLp;$('simpleTrade').hidden=isLp;if(isLp){lpMode('add');range('wide');$('fundDeposit').value='';$('usdgDeposit').value='';}else{$('simpleMarket').textContent='$'+d.ticker+' / USDG';$('simpleNav').textContent='$'+d.nav.toFixed(2);$('simpleTitle').textContent=action==='Mint at NAV'?'Mint $'+d.ticker+' at NAV':'Buy $'+d.ticker;$('simpleCopy').textContent=action==='Mint at NAV'?'Seat-holder primary mint. Pay USDG and receive fund tokens at net asset value.':'Acquire the fund on the secondary market using USDG.';$('actionAmount').value='';$('simpleReceive').textContent='—';$('previewAction').textContent=action==='Mint at NAV'?'Mint at NAV':'Preview buy';}
   modal.classList.add('show');modal.setAttribute('aria-hidden','false');}
 function close(){modal.classList.remove('show');modal.setAttribute('aria-hidden','true')}
 document.querySelectorAll('.action').forEach(b=>b.onclick=e=>{e.stopPropagation();config(b.dataset.action,b.dataset.fund)});
 document.querySelectorAll('#actionModal .lpModeTab').forEach(b=>b.onclick=()=>lpMode(b.dataset.lpMode));document.querySelectorAll('#actionModal .rangePreset').forEach(b=>b.onclick=()=>range(b.dataset.range));
 $('fundDeposit').oninput=()=>{const v=Number($('fundDeposit').value);$('usdgDeposit').value=Number.isFinite(v)&&v>0?(v*state.d.nav).toFixed(2):''};$('usdgDeposit').oninput=()=>{const v=Number($('usdgDeposit').value);$('fundDeposit').value=Number.isFinite(v)&&v>0?(v/state.d.nav).toFixed(4):''};$('actionAmount').oninput=()=>{const v=Number($('actionAmount').value);$('simpleReceive').textContent=Number.isFinite(v)&&v>0?(v/state.d.nav).toFixed(4)+' '+state.d.ticker:'—'};
 document.querySelectorAll('#actionModal [data-withdraw]').forEach(b=>b.onclick=()=>{document.querySelectorAll('#actionModal [data-withdraw]').forEach(x=>x.style.borderColor='');b.style.borderColor='#d8b43f';$('ticketNote').textContent=b.dataset.withdraw+'% of mock LP position selected.'});
 $('previewAction').onclick=()=>{if(!$('lpWorkspace').hidden){if(state.lpMode==='add'){const v=Number($('usdgDeposit').value);if(!Number.isFinite(v)||v<=0)return toast('Enter a deposit amount.');close();toast('Liquidity deposit previewed · simulated.');}else if(state.lpMode==='withdraw'){close();toast('LP withdrawal previewed · simulated.');}else{close();toast('Fees + emissions collected · simulated.');}}else{const v=Number($('actionAmount').value);if(!Number.isFinite(v)||v<=0)return toast('Enter a USDG amount.');close();toast((state.action==='Mint at NAV'?'NAV mint':'Buy')+' · simulated.');}};
 $('closeModal').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('show'))close()});
})();
</script>
'''

          shared_js_detail = shared_js_funds.replace("$('actionModal')","$('modal')").replace("#actionModal","#modal").replace("id('actionModal')","id('modal')").replace("$('ticketType')","$('actionLabel')").replace("$('ticketTitle')","$('modalTicker')").replace("$('actionAmount')","$('amount')").replace("$('previewAction')","$('preview')").replace("$('closeModal')","$('close')")
          # Fix controller's direct modal lookup after string replacements.
          shared_js_detail = shared_js_detail.replace("const $=id=>document.getElementById(id), modal=$('modal');", "const $=id=>document.getElementById(id), modal=$('modal');")

          # FUNDS OVERVIEW
          p=Path('funds.html'); s=p.read_text()
          s=s.replace('Pairs settle in <b>GLD</b>','Pairs settle in <b>USDG</b>')
          s=s.replace('$gAIX / GLD','$gAIX / USDG').replace('$gMEMESTONK / GLD','$gMEMESTONK / USDG')
          s=s.replace("+' / GLD'", "+' / USDG'").replace(' / GLD</strong>',' / USDG</strong>')
          s=s.replace('${ticker} / GLD','${ticker} / USDG')
          a=s.index('<div class="modal" id="actionModal"'); b=s.index('<div class="toast" id="toast">',a); s=s[:a]+funds_modal+s[b:]
          if '/* Goldstein LP / primary-market ticket v5 */' not in s:s=s.replace('</style>',shared_css+'\n</style>',1)
          if '/* Goldstein action-ticket controller v5 */' not in s:s=s.replace('</body>',shared_js_funds+'\n</body>',1)
          p.write_text(s)

          # FUND DETAILS
          p=Path('fund-detail.html'); s=p.read_text()
          s=s.replace('$gAIX / GLD','$gAIX / USDG').replace('$gMEMESTONK / GLD','$gMEMESTONK / USDG')
          s=s.replace("+' / GLD'", "+' / USDG'").replace('${ticker} / GLD','${ticker} / USDG')
          s=s.replace("stats[3].textContent='GLD'", "stats[3].textContent='USDG'")
          a=s.index('<div class="modal" id="modal">'); b=s.index('<div class="toast" id="toast">',a); s=s[:a]+detail_modal+s[b:]
          if '/* Goldstein LP / primary-market ticket v5 */' not in s:s=s.replace('</style>',shared_css+'\n</style>',1)
          if '/* Goldstein action-ticket controller v5 */' not in s:s=s.replace('</body>',shared_js_detail+'\n</body>',1)
          p.write_text(s)

          # MY SEAT — clarify primary mint settlement without touching GLD salary.
          p=Path('my-seat.html'); s=p.read_text().replace('Primary minting at NAV.','Primary minting with USDG at NAV.')
          p.write_text(s)

          # PUBLIC LANDING — clarify the same primary-market settlement.
          p=Path('landing.html'); s=p.read_text().replace('Seat holders mint G-Funds at net asset value.','Seat holders mint G-Funds at NAV using USDG.')
          p.write_text(s)
          PY

      - name: Validate
        run: |
          grep -q 'Pairs settle in <b>USDG</b>' funds.html
          grep -q 'Goldstein LP / primary-market ticket v5' funds.html
          grep -q 'Goldstein action-ticket controller v5' funds.html
          grep -q 'data-lp-mode="withdraw"' funds.html
          grep -q 'data-range="tight"' funds.html
          grep -q 'Settlement</small><b>USDG' funds.html
          grep -q 'Goldstein LP / primary-market ticket v5' fund-detail.html
          grep -q "stats\[3\].textContent='USDG'" fund-detail.html
          grep -q 'Primary minting with USDG at NAV.' my-seat.html
          grep -q 'mint G-Funds at NAV using USDG' landing.html
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const f of ['funds.html','fund-detail.html','my-seat.html','landing.html']){
            const s=fs.readFileSync(f,'utf8');
            for(const m of s.matchAll(/<script>([\s\S]*?)<\/script>/g)) new vm.Script(m[1]);
          }
          console.log('JS syntax OK');
          NODE

      - name: Commit
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add funds.html fund-detail.html my-seat.html landing.html
          git commit -m "Add LP management modal and switch fund settlement to USDG" || exit 0
          git push
