name: Integrate native Rabbi Schlomo rank artwork

on:
  push:
    paths:
      - '.github/workflows/native-rabbi-ranks-v1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply native NFT artwork
        run: python3 scripts/native-rabbi-ranks-v1.py

      - name: Validate integration
        run: |
          for f in 18.png 2_intern.png 3_analyst.png 4_associate.png 5_vp.png 6_md.png 7_partner.png; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          grep -q "rank-base{background-image:url('/18.png')" my-seat.html
          grep -q "rank-partner{background-image:url('/7_partner.png')" my-seat.html
          grep -q 'data-rank="-1"' my-seat.html
          grep -q "const baseSeat={key:'base',label:'Seat'}" my-seat.html
          grep -q "const mintRanks=\[\['base','Seat'\]" app.html
          grep -q 'data-mint-rank="6">Partner' app.html
          grep -q "partner:'/7_partner.png'" welcome.html
          ! grep -q '/assets/rank-sprite.css' app.html
          ! grep -q '/assets/rank-sprite.css' my-seat.html
          ! grep -q '/assets/rank-sprite.css' welcome.html
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const f of ['app.html','my-seat.html','welcome.html']){
            const s=fs.readFileSync(f,'utf8');
            const scripts=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
            for(const js of scripts)new vm.Script(js,{filename:f});
          }
          console.log('JavaScript syntax OK');
          NODE

      - name: Commit implementation
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.html my-seat.html welcome.html
          git commit -m "Use native Rabbi Schlomo rank artwork" || exit 0
          git push
