name: Wire landing page and app routes

on:
  push:
    paths:
      - '.github/workflows/landing-routes.yml'
      - 'scripts/namespace_app_routes.py'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Namespace app routes
        run: python3 scripts/namespace_app_routes.py

      - name: Validate landing and app architecture
        run: |
          grep -q 'The investment firm' landing.html
          grep -q 'href="/app"' landing.html
          grep -q 'href="/app" target="_top"' index.html
          grep -q 'href="/app/my-seat" target="_top"' index.html
          grep -q 'href="/app/funds" target="_top"' index.html
          grep -q 'href="/app" target="_top"' my-seat.html
          grep -q 'href="/app/funds" target="_top"' funds.html
          grep -q 'href="/app/funds">← G-Funds' fund-detail.html
          grep -q "window.location.href='/app/my-seat'" welcome.html
          python3 - <<'PY'
          import json
          j=json.load(open('vercel.json'))
          routes={x['source']:x['destination'] for x in j['rewrites']}
          assert routes['/']=='/landing.html'
          assert routes['/app']=='/welcome.html'
          assert routes['/app/my-seat']=='/my-seat.html'
          assert routes['/app/funds']=='/funds.html'
          assert routes['/app/funds/gaix']=='/fund-detail.html'
          assert routes['/app/funds/gmemestonk']=='/fund-detail.html'
          print('Routes OK')
          PY

      - name: JavaScript sanity check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for filename in ['landing.html','index.html','my-seat.html','funds.html','fund-detail.html','welcome.html']:
              html=Path(filename).read_text()
              ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: raise SystemExit(f'{filename}: duplicate IDs: {dup}')
              for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)):
                  tmp=Path('/tmp')/f'{filename}-{i}.js';tmp.write_text(js)
                  subprocess.run(['node','--check',str(tmp)],check=True)
          print('DOM IDs and JS syntax OK')
          PY

      - name: Commit routing integration
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html my-seat.html funds.html fund-detail.html welcome.html vercel.json
          git commit -m "Connect public landing page to Goldstein HQ" || exit 0
          git push
