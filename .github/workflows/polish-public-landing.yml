name: Polish public Goldstein landing

on:
  push:
    paths:
      - '.github/workflows/polish-public-landing.yml'
      - 'scripts/polish_public_landing.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply public landing polish
        run: python3 scripts/polish_public_landing.py
      - name: Validate public page quality
        run: |
          grep -q 'twitter:card' index.html
          grep -q 'aria-expanded="false"' index.html
          grep -q 'class="skipLink"' index.html
          grep -q 'id="main"' index.html
          grep -q 'href="/app"' index.html
          grep -q 'The investment firm' index.html
          grep -q 'twitter:card' landing.html
      - name: JavaScript and DOM sanity check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for filename in ['index.html','landing.html']:
              html=Path(filename).read_text()
              ids=re.findall(r'\bid=["\']([^"\']+)["\']',html)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup: raise SystemExit(f'{filename}: duplicate IDs: {dup}')
              for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',html,re.S)):
                  tmp=Path('/tmp')/f'{filename}-{i}.js';tmp.write_text(js)
                  subprocess.run(['node','--check',str(tmp)],check=True)
          print('Landing QA clean')
          PY
      - name: Commit landing polish
        run: |
          git config user.name "Goldstein UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html landing.html
          git commit -m "Polish Goldstein public landing experience" || exit 0
          git push
